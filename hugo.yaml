# Hugo configuration file
title: Waikato ICU

enableGitInfo: true


# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: ICU Handbook
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/imfing"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search


params:
  description: "Resources for Intensive Care Practice"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/justinkohts/icu-handbook/edit/main/content"

  externalLinkDecoration: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  theme.default: system

  displayUpdatedDate: true
  displayUpdatedAuthor: false
  dateFormat: "2 January 2006"
